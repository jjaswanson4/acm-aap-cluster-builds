# Dedicated Control Plane + Workers (3 Masters + 3 Workers)
#
# 3 dedicated control plane nodes + 3 worker nodes.
# Masters handle only etcd and control plane components.
# Workers run all user workloads, ingress, and monitoring.
# Push mode with BMC automation.

clusterName: my-cluster
namespace: my-cluster
baseDomain: example.com

pullSecret:
  dockerconfigjson: "YOUR_BASE64_ENCODED_PULL_SECRET"

sshPublicKey: "ssh-ed25519 AAAA... user@host"

registrationMode: "push"
autoApproveHosts: "true"
deployCertsToBMCs: "true"
baremetalHostPaused: "false"

agentClusterInstall:
  apiVIP: "192.168.1.10"
  ingressVIP: "192.168.1.11"
  imageSetRef: img4.22.6-x86-64-appsub
  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16
  provisionRequirements:
    controlPlaneAgents: 3
    workerAgents: 3

nodes:
  # --- Control Plane ---
  - name: master-0
    bmcAddress: redfish-virtualmedia+https://192.168.100.10/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:01"
    hostname: "master-0.my-cluster.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000001"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:01"
      ipv4:
        address: "192.168.1.21"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"

  - name: master-1
    bmcAddress: redfish-virtualmedia+https://192.168.100.11/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:02"
    hostname: "master-1.my-cluster.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000002"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:02"
      ipv4:
        address: "192.168.1.22"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"

  - name: master-2
    bmcAddress: redfish-virtualmedia+https://192.168.100.12/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:03"
    hostname: "master-2.my-cluster.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000003"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:03"
      ipv4:
        address: "192.168.1.23"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"

  # --- Workers ---
  - name: worker-0
    bmcAddress: redfish-virtualmedia+https://192.168.100.20/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:11"
    hostname: "worker-0.my-cluster.example.com"
    role: "worker"
    rootDeviceWWN: "eui.0000000000000011"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:11"
      ipv4:
        address: "192.168.1.31"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"

  - name: worker-1
    bmcAddress: redfish-virtualmedia+https://192.168.100.21/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:12"
    hostname: "worker-1.my-cluster.example.com"
    role: "worker"
    rootDeviceWWN: "eui.0000000000000012"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:12"
      ipv4:
        address: "192.168.1.32"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"

  - name: worker-2
    bmcAddress: redfish-virtualmedia+https://192.168.100.22/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:13"
    hostname: "worker-2.my-cluster.example.com"
    role: "worker"
    rootDeviceWWN: "eui.0000000000000013"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:13"
      ipv4:
        address: "192.168.1.33"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"
