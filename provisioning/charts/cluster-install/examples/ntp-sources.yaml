# Custom NTP Sources
#
# SNO cluster with additional NTP sources configured via the InfraEnv resource.
# The Assisted Service merges these with any NTP servers provided by DHCP
# (option 42) and generates MachineConfig resources for chrony automatically.
#
# Use this when:
#   - Your network doesn't provide NTP via DHCP
#   - You need to point nodes at specific internal NTP servers
#   - You want to ensure NTP is configured before the cluster comes up
#
# No post-install MachineConfig or Butane config is needed — the Assisted
# Service handles chrony configuration during installation.

clusterName: my-sno
namespace: my-sno
baseDomain: example.com

pullSecret:
  dockerconfigjson: "YOUR_BASE64_ENCODED_PULL_SECRET"

sshPublicKey: "ssh-ed25519 AAAA... user@host"

registrationMode: "push"
autoApproveHosts: "true"
baremetalHostPaused: "false"

agentClusterInstall:
  imageSetRef: img4.22.6-x86-64-appsub
  installConfigOverrides:
    cpuPartitioningMode: "None"
    capabilities:
      baselineCapabilitySet: "vCurrent"
      additionalEnabledCapabilities: []
  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16
  provisionRequirements:
    controlPlaneAgents: 1
    workerAgents: 0

# --- NTP configuration ---
infraEnv:
  kernelArguments: []
  additionalNTPSources:
    - "ntp1.example.com"
    - "ntp2.example.com"
    - "192.168.1.1"

nodes:
  - name: sno
    bmcAddress: redfish-virtualmedia+https://192.168.100.10/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:01"
    hostname: "sno.my-sno.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000001"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:01"
      ipv4:
        address: "192.168.1.21"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"
