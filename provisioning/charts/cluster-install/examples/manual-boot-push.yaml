# Manual ISO Boot — Push Mode
#
# 3-node compact cluster WITHOUT BMC credentials.
# The user must manually download and boot the discovery ISO on each node.
# Push mode: ACM pushes registration manifests to the cluster (default behavior).
#
# No BMC resources are created (no BareMetalHosts, no BMC secrets).
# NMStateConfigs are still created to configure node networking.
#
# To get the discovery ISO URL after install:
#   oc get infraenv my-cluster -n my-cluster -o jsonpath='{.status.isoDownloadURL}'
#
# To download the ISO:
#   curl -k -L -o discovery.iso $(oc get infraenv my-cluster -n my-cluster -o jsonpath='{.status.isoDownloadURL}')
#
# Boot each node from the ISO (USB, virtual media, or PXE). Once agents register,
# approve them manually:
#   oc get agents -n my-cluster
#   oc patch agent <agent-name> -n my-cluster --type merge -p '{"spec":{"approved":true}}'
#
# Or set autoApproveHosts: "true" below for unattended approval.

clusterName: my-cluster
namespace: my-cluster
baseDomain: example.com

pullSecret:
  dockerconfigjson: "YOUR_BASE64_ENCODED_PULL_SECRET"

sshPublicKey: "ssh-ed25519 AAAA... user@host"

# --- Deployment mode ---
registrationMode: "push"

# --- No BMC automation (manual boot) ---
# Uncomment to auto-approve agents instead of manual approval:
# autoApproveHosts: "true"

# --- Cluster sizing ---
agentClusterInstall:
  apiVIP: "192.168.1.10"
  ingressVIP: "192.168.1.11"
  imageSetRef: img4.22.6-x86-64-appsub
  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16
  provisionRequirements:
    controlPlaneAgents: 3
    workerAgents: 0

# --- Nodes (no bmcAddress or bmcCredentials) ---
nodes:
  - name: master-0
    bootMACAddress: "aa:bb:cc:dd:ee:01"
    hostname: "master-0.my-cluster.example.com"
    role: "master"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:01"
      ipv4:
        address: "192.168.1.21"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"

  - name: master-1
    bootMACAddress: "aa:bb:cc:dd:ee:02"
    hostname: "master-1.my-cluster.example.com"
    role: "master"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:02"
      ipv4:
        address: "192.168.1.22"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"

  - name: master-2
    bootMACAddress: "aa:bb:cc:dd:ee:03"
    hostname: "master-2.my-cluster.example.com"
    role: "master"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:03"
      ipv4:
        address: "192.168.1.23"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"
