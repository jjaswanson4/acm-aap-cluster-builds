# Static Network Configuration
#
# 3-node compact cluster with static IP addresses on a single NIC per node.
# This is the default and most common network configuration.
# Each node gets a static IPv4 address, default gateway, and DNS servers.

clusterName: my-cluster
namespace: my-cluster
baseDomain: example.com

pullSecret:
  dockerconfigjson: "YOUR_BASE64_ENCODED_PULL_SECRET"

sshPublicKey: "ssh-ed25519 AAAA... user@host"

registrationMode: "push"
autoApproveHosts: "true"
baremetalHostPaused: "false"

agentClusterInstall:
  apiVIP: "192.168.1.10"
  ingressVIP: "192.168.1.11"
  imageSetRef: img4.22.6-x86-64-appsub
  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16
  provisionRequirements:
    controlPlaneAgents: 3
    workerAgents: 0

nodes:
  - name: master-0
    bootMACAddress: "aa:bb:cc:dd:ee:01"
    hostname: "master-0.my-cluster.example.com"
    role: "master"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:01"
      ipv4:
        address: "192.168.1.21"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"
        - "8.8.8.8"

  - name: master-1
    bootMACAddress: "aa:bb:cc:dd:ee:02"
    hostname: "master-1.my-cluster.example.com"
    role: "master"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:02"
      ipv4:
        address: "192.168.1.22"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"
        - "8.8.8.8"

  - name: master-2
    bootMACAddress: "aa:bb:cc:dd:ee:03"
    hostname: "master-2.my-cluster.example.com"
    role: "master"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:03"
      ipv4:
        address: "192.168.1.23"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"
        - "8.8.8.8"
