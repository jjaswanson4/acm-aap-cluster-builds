# Disconnected / Air-Gapped Install with Mirror Registry
#
# 3-node compact cluster deployed in a disconnected environment where nodes
# cannot reach the internet. All container images are pulled from a local
# mirror registry.
#
# Required install-config-overrides:
#   - imageDigestSources: maps upstream registries to your local mirror
#   - additionalTrustBundle: CA certificate PEM for the mirror registry
#     (the full PEM including -----BEGIN/END CERTIFICATE----- markers)
#
# The mirror registry must be populated before deployment using oc-mirror
# or a similar tool. See:
#   https://docs.openshift.com/container-platform/latest/installing/disconnected_install/installing-mirroring-disconnected.html
#
# If the disconnected environment also requires a proxy for internal traffic,
# combine this with the proxy example (add the proxy block under installConfigOverrides).

clusterName: my-cluster
namespace: my-cluster
baseDomain: example.com

pullSecret:
  dockerconfigjson: "YOUR_BASE64_ENCODED_PULL_SECRET_WITH_MIRROR_REGISTRY_CREDS"

sshPublicKey: "ssh-ed25519 AAAA... user@host"

registrationMode: "push"
autoApproveHosts: "true"
baremetalHostPaused: "false"

agentClusterInstall:
  apiVIP: "192.168.1.10"
  ingressVIP: "192.168.1.11"
  imageSetRef: img4.22.6-x86-64-appsub

  installConfigOverrides:
    cpuPartitioningMode: "None"
    capabilities:
      baselineCapabilitySet: "vCurrent"
      additionalEnabledCapabilities: []

    # --- Mirror registry mappings ---
    # Each entry maps an upstream source to one or more local mirrors.
    # The installer rewrites image references to pull from the mirror instead.
    imageDigestSources:
      - source: "quay.io/openshift-release-dev/ocp-release"
        mirrors:
          - "registry.example.com:5000/openshift-release-dev/ocp-release"
      - source: "quay.io/openshift-release-dev/ocp-v4.0-art-dev"
        mirrors:
          - "registry.example.com:5000/openshift-release-dev/ocp-v4.0-art-dev"
      - source: "registry.redhat.io/redhat"
        mirrors:
          - "registry.example.com:5000/redhat"

    # --- Mirror registry CA certificate ---
    # The full PEM-encoded CA certificate that signed the mirror registry's
    # TLS certificate. This is injected into the cluster's trust store so
    # nodes can pull images over HTTPS.
    #
    # Use a multiline string with the complete PEM including markers.
    # In a real deployment, paste your actual CA certificate here.
    additionalTrustBundle: |
      -----BEGIN CERTIFICATE-----
      MIIDUTCCAjmgAwIBAgIJALbMYEB2lMKOMA0GCSqGSIb3DQEBCwUAMBsxGTAXBgNV
      ... your CA certificate content here ...
      -----END CERTIFICATE-----

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16
  provisionRequirements:
    controlPlaneAgents: 3
    workerAgents: 0

nodes:
  - name: master-0
    bmcAddress: redfish-virtualmedia+https://192.168.100.10/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:01"
    hostname: "master-0.my-cluster.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000001"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:01"
      ipv4:
        address: "192.168.1.21"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"

  - name: master-1
    bmcAddress: redfish-virtualmedia+https://192.168.100.11/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:02"
    hostname: "master-1.my-cluster.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000002"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:02"
      ipv4:
        address: "192.168.1.22"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"

  - name: master-2
    bmcAddress: redfish-virtualmedia+https://192.168.100.12/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:03"
    hostname: "master-2.my-cluster.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000003"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:03"
      ipv4:
        address: "192.168.1.23"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"
