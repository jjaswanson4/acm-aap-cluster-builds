# Disconnected Install with Proxy and Mirror Registry
#
# 3-node compact cluster in a restricted network environment that requires
# both a proxy for outbound traffic and a mirror registry for container images.
#
# This combines the proxy and disconnected examples into a single deployment,
# which is a common pattern in enterprise environments where:
#   - Nodes sit behind a corporate proxy
#   - Container images are mirrored to an internal registry
#   - The mirror registry uses a private CA
#
# The noProxy list should include the mirror registry hostname/IP to ensure
# image pulls go directly to the mirror rather than through the proxy.

clusterName: my-cluster
namespace: my-cluster
baseDomain: corp.example.com

pullSecret:
  dockerconfigjson: "YOUR_BASE64_ENCODED_PULL_SECRET_WITH_MIRROR_REGISTRY_CREDS"

sshPublicKey: "ssh-ed25519 AAAA... user@host"

registrationMode: "push"
autoApproveHosts: "true"
deployCertsToBMCs: "true"
baremetalHostPaused: "false"

agentClusterInstall:
  apiVIP: "10.0.50.10"
  ingressVIP: "10.0.50.11"
  imageSetRef: img4.22.6-x86-64-appsub

  installConfigOverrides:
    cpuPartitioningMode: "None"
    capabilities:
      baselineCapabilitySet: "vCurrent"
      additionalEnabledCapabilities: []

    # --- Proxy ---
    proxy:
      httpProxy: "http://squid.corp.example.com:3128"
      httpsProxy: "http://squid.corp.example.com:3128"
      noProxy: ".corp.example.com,10.0.0.0/8,10.128.0.0/14,172.30.0.0/16,registry.corp.example.com"

    # --- Mirror registry ---
    imageDigestSources:
      - source: "quay.io/openshift-release-dev/ocp-release"
        mirrors:
          - "registry.corp.example.com:5000/openshift-release-dev/ocp-release"
      - source: "quay.io/openshift-release-dev/ocp-v4.0-art-dev"
        mirrors:
          - "registry.corp.example.com:5000/openshift-release-dev/ocp-v4.0-art-dev"
      - source: "registry.redhat.io/redhat"
        mirrors:
          - "registry.corp.example.com:5000/redhat"
      - source: "registry.redhat.io/openshift4"
        mirrors:
          - "registry.corp.example.com:5000/openshift4"

    # --- Mirror registry CA ---
    additionalTrustBundle: |
      -----BEGIN CERTIFICATE-----
      MIIDUTCCAjmgAwIBAgIJALbMYEB2lMKOMA0GCSqGSIb3DQEBCwUAMBsxGTAXBgNV
      ... your mirror registry CA certificate here ...
      -----END CERTIFICATE-----

  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16
  provisionRequirements:
    controlPlaneAgents: 3
    workerAgents: 0

# --- NTP (often needed in disconnected environments) ---
infraEnv:
  kernelArguments: []
  additionalNTPSources:
    - "ntp.corp.example.com"

nodes:
  - name: master-0
    bmcAddress: redfish-virtualmedia+https://10.0.100.10/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:01"
    hostname: "master-0.my-cluster.corp.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000001"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:01"
      ipv4:
        address: "10.0.50.21"
        prefixLength: 24
      gateway: "10.0.50.1"
      dns:
        - "10.0.1.1"

  - name: master-1
    bmcAddress: redfish-virtualmedia+https://10.0.100.11/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:02"
    hostname: "master-1.my-cluster.corp.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000002"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:02"
      ipv4:
        address: "10.0.50.22"
        prefixLength: 24
      gateway: "10.0.50.1"
      dns:
        - "10.0.1.1"

  - name: master-2
    bmcAddress: redfish-virtualmedia+https://10.0.100.12/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:03"
    hostname: "master-2.my-cluster.corp.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000003"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:03"
      ipv4:
        address: "10.0.50.23"
        prefixLength: 24
      gateway: "10.0.50.1"
      dns:
        - "10.0.1.1"
