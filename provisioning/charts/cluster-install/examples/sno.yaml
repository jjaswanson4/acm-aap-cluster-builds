# Single Node OpenShift (SNO)
#
# 1 control plane node running all workloads (master + worker roles combined).
# No API/Ingress VIPs needed — the node's own IP is used for both.
# Push mode with BMC automation.

clusterName: my-sno
namespace: my-sno
baseDomain: example.com

pullSecret:
  dockerconfigjson: "YOUR_BASE64_ENCODED_PULL_SECRET"

sshPublicKey: "ssh-ed25519 AAAA... user@host"

registrationMode: "push"
autoApproveHosts: "true"
deployCertsToBMCs: "true"
baremetalHostPaused: "false"

agentClusterInstall:
  # No apiVIP or ingressVIP for SNO — the single node's IP serves both roles
  imageSetRef: img4.22.6-x86-64-appsub
  installConfigOverrides:
    cpuPartitioningMode: "AllNodes"
    capabilities:
      baselineCapabilitySet: "None"
      additionalEnabledCapabilities:
        - "baremetal"
        - "Console"
        - "Storage"
        - "Ingress"
        - "NodeTuning"
        - "OperatorLifecycleManager"
        - "marketplace"
        - "CSISnapshot"
  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16
  provisionRequirements:
    controlPlaneAgents: 1
    workerAgents: 0

nodes:
  - name: sno
    bmcAddress: redfish-virtualmedia+https://192.168.100.10/redfish/v1/Systems/system
    bmcCredentials:
      username: "admin"
      password: "password"
    bootMACAddress: "aa:bb:cc:dd:ee:01"
    hostname: "sno.my-sno.example.com"
    role: "master"
    rootDeviceWWN: "eui.0000000000000001"
    network:
      interface: eno1
      macAddress: "aa:bb:cc:dd:ee:01"
      ipv4:
        address: "192.168.1.21"
        prefixLength: 24
      gateway: "192.168.1.1"
      dns:
        - "192.168.1.1"
