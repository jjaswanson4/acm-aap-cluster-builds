---
- name: Configure BMC Boot Devices and Eject Virtual Media
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    namespace: "{{ lookup('env', 'NAMESPACE') }}"
  tasks:
    - name: Get BareMetalHost resources
      kubernetes.core.k8s_info:
        api_version: metal3.io/v1alpha1
        kind: BareMetalHost
        namespace: "{{ namespace }}"
      register: _bmh_list

    - name: End play if no BareMetalHosts found
      ansible.builtin.meta: end_play
      when: _bmh_list.resources | length == 0

    - name: Get BMC credentials for each host
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ item.spec.bmc.credentialsName }}"
        namespace: "{{ namespace }}"
      loop: "{{ _bmh_list.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: _bmc_credentials

    - name: Build host inventory
      ansible.builtin.set_fact:
        _bmc_hosts: "{{ _bmc_hosts | default([]) + [_host] }}"
      vars:
        _host:
          name: "{{ item.item.metadata.name }}"
          address: "{{ item.item.spec.bmc.address | regex_search('https?://([^/]+)/', '\\1') | first }}"
          username: "{{ item.resources[0].data.username | b64decode | trim }}"
          password: "{{ item.resources[0].data.password | b64decode | trim }}"
      loop: "{{ _bmc_credentials.results }}"
      loop_control:
        label: "{{ item.item.metadata.name }}"

    - name: Discover Redfish manager endpoint
      ansible.builtin.uri:
        url: "https://{{ item.address }}/redfish/v1/Managers"
        method: GET
        user: "{{ item.username }}"
        password: "{{ item.password }}"
        force_basic_auth: true
        validate_certs: false
      register: _managers_discovery
      loop: "{{ _bmc_hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Discover Redfish system endpoint
      ansible.builtin.uri:
        url: "https://{{ item.address }}/redfish/v1/Systems"
        method: GET
        user: "{{ item.username }}"
        password: "{{ item.password }}"
        force_basic_auth: true
        validate_certs: false
      register: _systems_discovery
      loop: "{{ _bmc_hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Enrich host inventory with discovered Redfish paths
      ansible.builtin.set_fact:
        _bmc_hosts_discovered: "{{ (_bmc_hosts_discovered | default([])) + [_host] }}"
      vars:
        _host: >-
          {{ _bmc_hosts[idx] | combine({
            'manager_path': _managers_discovery.results[idx].json.Members[0]['@odata.id'],
            'system_path': _systems_discovery.results[idx].json.Members[0]['@odata.id']
          }) }}
      loop: "{{ range(_bmc_hosts | length) | list }}"
      loop_control:
        loop_var: idx
        label: "{{ _bmc_hosts[idx].name }}"

    - name: Update host inventory with discovered paths
      ansible.builtin.set_fact:
        _bmc_hosts: "{{ _bmc_hosts_discovered }}"

    - name: Discover virtual media collection
      ansible.builtin.uri:
        url: "https://{{ item.address }}{{ item.manager_path }}/VirtualMedia"
        method: GET
        user: "{{ item.username }}"
        password: "{{ item.password }}"
        force_basic_auth: true
        validate_certs: false
      register: _vmedia_discovery
      loop: "{{ _bmc_hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Enrich host inventory with virtual media members
      ansible.builtin.set_fact:
        _bmc_hosts_vmedia: "{{ (_bmc_hosts_vmedia | default([])) + [_host] }}"
      vars:
        _host: >-
          {{ _bmc_hosts[idx] | combine({
            'vmedia_members': _vmedia_discovery.results[idx].json.Members
          }) }}
      loop: "{{ range(_bmc_hosts | length) | list }}"
      loop_control:
        loop_var: idx
        label: "{{ _bmc_hosts[idx].name }}"

    - name: Update host inventory with virtual media members
      ansible.builtin.set_fact:
        _bmc_hosts: "{{ _bmc_hosts_vmedia }}"

    - name: Wait for all agents to register
      kubernetes.core.k8s_info:
        api_version: agent-install.openshift.io/v1beta1
        kind: Agent
        namespace: "{{ namespace }}"
      register: _agents
      until: (_agents.resources | length) >= (_bmh_list.resources | length)
      retries: 120
      delay: 15

    - name: Eject all virtual media
      ansible.builtin.uri:
        url: "https://{{ item.0.address }}{{ item.1['@odata.id'] }}/Actions/VirtualMedia.EjectMedia"
        method: POST
        user: "{{ item.0.username }}"
        password: "{{ item.0.password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 204, 400, 500]
        body_format: json
        body: {}
      loop: "{{ _bmc_hosts | subelements('vmedia_members') }}"
      loop_control:
        label: "{{ item.0.name }} - {{ item.1['@odata.id'].split('/')[-1] }}"

    - name: Set boot override to HDD
      ansible.builtin.uri:
        url: "https://{{ item.address }}{{ item.system_path }}"
        method: PATCH
        user: "{{ item.username }}"
        password: "{{ item.password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 204]
        body_format: json
        body:
          Boot:
            BootSourceOverrideTarget: "Hdd"
            BootSourceOverrideEnabled: "Continuous"
      loop: "{{ _bmc_hosts }}"
      loop_control:
        label: "{{ item.name }}"
