---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  annotations:
{{- if eq (.Values.namespaceResourcePolicy | default "keep") "keep" }}
    "helm.sh/resource-policy": keep
    "argocd.argoproj.io/sync-options": "Prune=false"
{{- end }}
    "argocd.argoproj.io/sync-wave": "-5"
