{{- if .Values.clusterManifests }}
{{- if gt (len .Values.clusterManifests) 0 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-manifests
  namespace: {{ .Values.namespace }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-2"
data:
{{- range $filename, $content := .Values.clusterManifests }}
  {{ $filename }}: |
{{ $content | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
