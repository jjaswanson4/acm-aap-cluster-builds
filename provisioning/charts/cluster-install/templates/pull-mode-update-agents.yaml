{{- if eq .Values.registrationMode "pull" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clusterName }}-update-agents
  namespace: {{ .Values.namespace }}
  annotations:
    "argocd.argoproj.io/sync-wave": "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.clusterName }}-update-agents
  annotations:
    "argocd.argoproj.io/sync-wave": "3"
rules:
  - apiGroups: ["agent-install.openshift.io"]
    resources: ["agents"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.clusterName }}-update-agents
  annotations:
    "argocd.argoproj.io/sync-wave": "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.clusterName }}-update-agents
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterName }}-update-agents
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.clusterName }}-update-agents
  namespace: {{ .Values.namespace }}
  annotations:
    "argocd.argoproj.io/sync-wave": "3"
spec:
  backoffLimit: 10
  template:
    metadata:
      name: {{ .Values.clusterName }}-update-agents
    spec:
      serviceAccountName: {{ .Values.clusterName }}-update-agents
      restartPolicy: Never
      containers:
        - name: update-agents
          image: "registry.redhat.io/openshift4/ose-cli:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICEACCOUNT
              value: "system:serviceaccount:{{ .Values.namespace }}:{{ .Values.clusterName }}-update-agents"
          command: ["/bin/bash"]
          args:
            - -exc
            - |
              # Extract cluster name from serviceaccount
              cluster_name="{{ .Values.clusterName }}"

              # Get all hosts from node-configs ConfigMap
              mapfile -t hosts < <(oc get configmap -n "$cluster_name" node-configs -ogo-template='{{`{{ range $k, $v := .data }}{{ $k }}{{ "\n" }}{{ end }}`}}')

              # Track patched agents
              patched_agents=()

              echo "Found ${#hosts[@]} hosts to configure: ${hosts[*]}"
              echo "Waiting for agents to be created and patching them..."

              # Until we've patched all hosts
              while ((${#hosts[@]} != ${#patched_agents[@]})); do
                # Iterate through the hosts
                for host in "${hosts[@]}"; do
                  # Pull the config for this host to get the MAC address
                  host_config="$(oc get configmap -n "$cluster_name" node-configs -ogo-template='{{`{{ index .data "`}}'"$host"'{{`" }}`}}')"
                  boot_mac="$(echo "$host_config" | grep -o '"bootMACAddress":\s*"[^"]*"' | cut -d'"' -f4)"

                  # Identify if an agent has been created for this host
                  # Match by hostname OR by MAC address (more reliable for single-node clusters)
                  agent="$(oc get agent -ogo-template='{{`{{ range .items }}{{ $mac := "" }}{{ range .status.inventory.interfaces }}{{ if .macAddress }}{{ if eq .macAddress "`}}'"$boot_mac"'{{`" }}{{ $mac = "match" }}{{ end }}{{ end }}{{ end }}{{ if or (eq .status.inventory.hostname "`}}'"$host"'{{`") (eq .spec.hostname "`}}'"$host"'{{`") (eq $mac "match") }}{{ .metadata.name }}{{ end }}{{ end }}`}}')"

                  # If an agent has been created and we haven't already patched it
                  if [ -n "$agent" ] && [[ ! " ${patched_agents[*]} " =~ " ${host} " ]]; then
                    echo "Found agent $agent for host $host (matched by hostname or MAC $boot_mac), applying configuration..."

                    # Extract role from the host_config (parse JSON with grep/sed since jq may not be available)
                    role="$(echo "$host_config" | grep -o '"role":\s*"[^"]*"' | cut -d'"' -f4)"

                    # Build the patch config
                    config='{"spec":{"hostname":"'"$host"'","role":"'"$role"'"}}'

                    # Use it as a merge patch
                    oc patch agent "$agent" --type=merge -p "$config"

                    # Also patch the agent for the cluster
                    oc patch agent "$agent" --type=merge -p '{"metadata":{"labels":{"agent-install.openshift.io/clusterdeployment-namespace":"'"$cluster_name"'"}},"spec":{"clusterDeploymentName":{"name":"'"$cluster_name"'","namespace":"'"$cluster_name"'"}}}'

                    echo "Successfully patched agent $agent"

                    # Track patched agents
                    patched_agents+=("$host")
                    echo "Progress: ${#patched_agents[@]}/${#hosts[@]} agents patched"
                  fi
                done

                # Brief sleep before checking again
                if ((${#hosts[@]} != ${#patched_agents[@]})); then
                  sleep 5
                fi
              done

              echo "All ${#hosts[@]} agents have been configured successfully"
{{- end }}
