---
apiVersion: extensions.hive.openshift.io/v1beta1
kind: AgentClusterInstall
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Values.namespace }}
  annotations:
    agent-install.openshift.io/install-config-overrides: |
      {
        "cpuPartitioningMode": {{ .Values.agentClusterInstall.installConfigOverrides.cpuPartitioningMode | quote }},
        "capabilities": {
          "baselineCapabilitySet": {{ .Values.agentClusterInstall.installConfigOverrides.capabilities.baselineCapabilitySet | quote }},
          "additionalEnabledCapabilities": [
{{- $last := sub (len .Values.agentClusterInstall.installConfigOverrides.capabilities.additionalEnabledCapabilities) 1 }}
{{- range $index, $cap := .Values.agentClusterInstall.installConfigOverrides.capabilities.additionalEnabledCapabilities }}
            {{ $cap | quote }}{{ if ne $index $last }},{{ end }}
{{- end }}
          ]
        }
{{- if .Values.agentClusterInstall.installConfigOverrides.imageDigestSources }},
        "imageDigestSources": [
{{- $lastSource := sub (len .Values.agentClusterInstall.installConfigOverrides.imageDigestSources) 1 }}
{{- range $i, $source := .Values.agentClusterInstall.installConfigOverrides.imageDigestSources }}
          {
            "source": {{ $source.source | quote }},
            "mirrors": [
{{- $lastMirror := sub (len $source.mirrors) 1 }}
{{- range $j, $mirror := $source.mirrors }}
              {{ $mirror | quote }}{{ if ne $j $lastMirror }},{{ end }}
{{- end }}
            ]
          }{{ if ne $i $lastSource }},{{ end }}
{{- end }}
        ]
{{- end }}
{{- if .Values.agentClusterInstall.installConfigOverrides.additionalTrustBundle }},
        "additionalTrustBundle": {{ .Values.agentClusterInstall.installConfigOverrides.additionalTrustBundle | quote }}
{{- end }}
{{- if .Values.agentClusterInstall.installConfigOverrides.proxy }},
        "proxy": {
          "httpProxy": {{ .Values.agentClusterInstall.installConfigOverrides.proxy.httpProxy | default "" | quote }},
          "httpsProxy": {{ .Values.agentClusterInstall.installConfigOverrides.proxy.httpsProxy | default "" | quote }},
          "noProxy": {{ .Values.agentClusterInstall.installConfigOverrides.proxy.noProxy | default "" | quote }}
        }
{{- end }}
      }
spec:
{{- $totalAgents := add .Values.agentClusterInstall.provisionRequirements.controlPlaneAgents .Values.agentClusterInstall.provisionRequirements.workerAgents }}
{{- if gt $totalAgents 1 }}
  apiVIP: {{ .Values.agentClusterInstall.apiVIP | quote }}
  ingressVIP: {{ .Values.agentClusterInstall.ingressVIP | quote }}
{{- end }}
  clusterDeploymentRef:
    name: {{ .Values.clusterName }}
  imageSetRef:
    name: {{ .Values.agentClusterInstall.imageSetRef }}
{{- if or (eq .Values.registrationMode "pull") (and .Values.argocdAgent (eq (.Values.argocdAgent.enabled | default "false" | toString) "true")) }}
  holdInstallation: true
{{- end }}
{{- if and .Values.clusterManifests (gt (len .Values.clusterManifests) 0) }}
  manifestsConfigMapRefs:
    - name: cluster-manifests
{{- end }}
  networking:
    clusterNetwork:
{{- range .Values.agentClusterInstall.networking.clusterNetwork }}
    - cidr: {{ .cidr }}
      hostPrefix: {{ .hostPrefix }}
{{- end }}
    serviceNetwork:
{{- range .Values.agentClusterInstall.networking.serviceNetwork }}
    - {{ . }}
{{- end }}
  provisionRequirements:
    controlPlaneAgents: {{ .Values.agentClusterInstall.provisionRequirements.controlPlaneAgents }}
    workerAgents: {{ .Values.agentClusterInstall.provisionRequirements.workerAgents }}
  sshPublicKey: {{ .Values.sshPublicKey | quote }}
